<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Maths</title>

<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#05070d;
    font-family:system-ui,Arial;
    color:white;
  }

  .panel{
    text-align:center;
    padding:30px;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:16px;
    background:rgba(255,255,255,0.03);
    backdrop-filter: blur(10px);
  }

  button{
    padding:14px 20px;
    margin:6px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    color:white;
    font-size:14px;
    transition:0.2s;
  }

  button:hover{
    transform:scale(1.05);
  }
</style>
</head>

<body>

<div class="panel">
  <h1>Google DOCS</h1>
  <p>Math Classroom</p>
  <button onclick="openHub()">Launch</button>
</div>

<script>
function openHub(){

  const w = window.open("", "_blank");
  if(!w){
    alert("Popup blocked");
    return;
  }

  const html = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Google Classroom</title>

<style>
  html, body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:system-ui;
    background:#000;
    color:#00ff88;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    background:rgba(0,0,0,0.95);
    border-bottom:1px solid rgba(0,255,136,0.2);
  }

  .left, .right{
    display:flex;
    gap:8px;
    overflow-x:auto;
    white-space:nowrap;
  }

  button{
    flex:0 0 auto;
    padding:9px 12px;
    border:1px solid rgba(0,255,136,0.3);
    background:#050505;
    color:#00ff88;
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
  }

  button:hover{
    background:#00ff8820;
  }

  iframe{
    width:100vw;
    height:calc(100vh - 50px);
    border:none;
    background:black;
  }

  #infoBox{
    position:absolute;
    top:60px;
    left:10px;
    padding:10px;
    border:1px solid rgba(0,255,136,0.3);
    background:#000;
    display:none;
    width:220px;
  }

  /* FULLSCREEN FIX */
  :fullscreen iframe{
    width:100vw;
    height:100vh;
  }

  :fullscreen .topbar{
    display:none;
  }
</style>
</head>

<body>

<div class="topbar">


  <div class="left" id="leftBar">

    <button onclick="load('https://krunker.io')">Krunker</button>
    <button onclick="load('https://kour.io')">Kour.io</button>
    <button onclick="load('https://ev.io')">Ev.io</button>
    <button onclick="load('https://shellshock.io')">Shell Shockers</button>
    <button onclick="load('https://venge.io')">Venge.io</button>

    <!-- NEW ADDED (you requested) -->
    <button onclick="load('https://iogames.space/')">IO Games</button>
    <button onclick="load('https://classroom6x.org/')">Classroom6x</button>
    <button onclick="load('https://www.coolmathgames.com/')">Coolmath</button>
    <button onclick="load('https://www.hoodamath.com/#gsc.tab=0')">HoodaMath</button>

  </div>

  <!-- RIGHT: CONTROLS -->
  <div class="right">
    <button onclick="toggleFullscreen()">Fullscreen</button>
    <button onclick="toggleInfo()">Info</button>
    <button onclick="addSite()">+ Add Site</button>
  </div>

</div>

<div id="infoBox">
  <b>hi</b><br><br>
  Update:<br>
  • new games + custom sites<br>
  • New game sites added<br>
  • Custom sites up to 10
</div>

<iframe id="frame"></iframe>

<script>

let current = "";
let customCount = 0;

const frame = document.getElementById("frame");
const infoBox = document.getElementById("infoBox");

frame.src = "https://krunker.io";

function load(url){
  if(current === url) return;
  current = url;
  frame.src = url;
}

// FULLSCREEN (REAL FIX)
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// INFO
function toggleInfo(){
  infoBox.style.display =
    infoBox.style.display === "block" ? "none" : "block";
}

// ADD CUSTOM SITE
function addSite(){

  if(customCount >= 10){
    alert("Max 10 custom sites reached");
    return;
  }

  const url = prompt("Enter website URL:");
  if(!url) return;

  try{
    const fixed = new URL(url).href;

    customCount++;
    const name = "Custom" + customCount;

    const btn = document.createElement("button");
    btn.innerText = name;
    btn.onclick = () => load(fixed);

    document.getElementById("leftBar").appendChild(btn);

    alert(name + " added");

  } catch(e){
    alert("Invalid URL");
  }
}

// hide UI in fullscreen
document.addEventListener("fullscreenchange", () => {
  document.querySelector(".topbar").style.display =
    document.fullscreenElement ? "none" : "flex";
});

<\/script>

</body>
</html>
`;

  w.document.open();
  w.document.write(html);
  w.document.close();
}
</script>

</body>
</html>
