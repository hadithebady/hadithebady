<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Good Bye</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#050505;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    position:relative;
}

/* Animated background */
body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background:
        radial-gradient(circle at 20% 20%, #00ffee33 0%, transparent 20%),
        radial-gradient(circle at 80% 40%, #8b5cf633 0%, transparent 20%),
        radial-gradient(circle at 50% 80%, #00ff9933 0%, transparent 20%);
    animation:bgMove 12s linear infinite;
}

@keyframes bgMove{
    0%{
        transform:translate(0,0) rotate(0deg);
    }
    100%{
        transform:translate(-10%,-10%) rotate(360deg);
    }
}

/* Floating particles */
.particle{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    opacity:0.4;
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-100vh);
    }
}

.container{
    position:relative;
    z-index:2;
    text-align:center;
    padding:50px;
    backdrop-filter:blur(12px);
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:28px;
    width:min(90%,800px);
    box-shadow:
        0 0 40px rgba(0,255,200,0.1),
        0 0 80px rgba(139,92,246,0.08);
    animation:fadeUp 1.5s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    font-size:clamp(3rem,8vw,6rem);
    font-weight:800;
    letter-spacing:4px;
    margin-bottom:20px;
    background:linear-gradient(90deg,#00ffee,#8b5cf6,#00ff99);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:glow 4s infinite alternate;
}

@keyframes glow{
    from{
        filter:drop-shadow(0 0 10px #00ffee88);
    }
    to{
        filter:drop-shadow(0 0 30px #8b5cf6aa);
    }
}

.subtitle{
    font-size:1.2rem;
    opacity:0.8;
    margin-bottom:35px;
    animation:pulse 3s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:0.6;
    }
    50%{
        opacity:1;
    }
}

.end{
    font-size:2rem;
    font-weight:700;
    margin-bottom:30px;
    color:#ffffff;
}

.link-box{
    display:inline-block;
    padding:18px 28px;
    border-radius:18px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    transition:0.35s ease;
    text-decoration:none;
    color:#00ffee;
    font-weight:600;
    font-size:1rem;
    overflow-wrap:anywhere;
}

.link-box:hover{
    transform:scale(1.05);
    background:rgba(255,255,255,0.12);
    box-shadow:0 0 25px rgba(0,255,238,0.3);
}

.scanline{
    position:absolute;
    width:100%;
    height:4px;
    background:rgba(255,255,255,0.05);
    top:-10%;
    animation:scan 6s linear infinite;
}

@keyframes scan{
    0%{
        top:-10%;
    }
    100%{
        top:110%;
    }
}

.footer{
    margin-top:40px;
    opacity:0.45;
    font-size:0.9rem;
    letter-spacing:2px;
}
</style>
</head>
<body>

<div class="scanline"></div>

<!-- Particles -->
<script>
for(let i=0;i<80;i++){
    const p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"vw";
    p.style.animationDuration=(5+Math.random()*10)+"s";
    p.style.opacity=Math.random();
    p.style.transform=`scale(${Math.random()*2})`;
    document.body.appendChild(p);
}
</script>

<div class="container">
    <h1>GOOD BYE</h1>

    <div class="subtitle">
        Locked in...
    </div>

    <div class="end">
        THE END
    </div>

    <a class="link-box"
       href="https://www.hadithebady.store/Terminal.html"
       target="_blank">
       Go to: https://www.hadithebady.store/Terminal.html to look coolll!!
    </a>

    <div class="footer">
        shutting down...
    </div>
</div>

</body>
</html>
